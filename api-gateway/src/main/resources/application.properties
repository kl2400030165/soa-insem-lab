server.port=8080
spring.application.name=api-gateway

# Spring Cloud Gateway Route Configuration
spring.cloud.gateway.routes[0].id=driver-service-route
spring.cloud.gateway.routes[0].uri=lb://driver-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/drivers/**

# Static Instances for Spring Cloud LoadBalancer
spring.cloud.discovery.client.simple.instances.driver-service[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.driver-service[1].uri=http://localhost:8082
spring.cloud.discovery.client.simple.instances.driver-service[2].uri=http://localhost:8083

# Disable cache to see immediate round-robin rotation across instances
spring.cloud.loadbalancer.cache.enabled=false
